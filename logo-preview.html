<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>BSP Logo Preview</title>
  <style>
    body { background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 2rem; font-family: sans-serif; }
    h3 { color: #555; margin-bottom: 0.25rem; }
    .size-label { font-size: 0.8rem; color: #999; margin-bottom: 0.5rem; }
    img { display: block; border-radius: 50%; }
  </style>
</head>
<body>
  <h3>Full size (500px)</h3>
  <img src="logo.svg" width="500" height="500"/>
  <h3>Instagram PFP size (110px circle)</h3>
  <img src="logo.svg" width="110" height="110" style="border-radius:50%;"/>
  <h3>Small (40px)</h3>
  <img src="logo.svg" width="40" height="40" style="border-radius:50%;"/>
</body>
</html>
